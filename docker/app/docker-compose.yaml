services:
  django-app:
    image: cosobenin/grm-app:v.1.0.8
    restart: always
    ports:
      - '9000:9000'
   # network_mode: "host"
    env_file: .env
    volumes:
      - static-content:/usr/appserver/staticfiles
    depends_on:
      - db
      - redis

  db:
    image: postgres:17.0
    restart: always
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  nginx:
    image: nginx:alpine
    restart: always
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - '80:80'
      - '443:443'
    network_mode: "host"
    volumes:
      - ./data/nginx:/etc/nginx/conf.d
      - static-content:/var/www/app/staticfiles
    depends_on:
      - django-app

  redis:
    image: redis:alpine
    restart: always
    hostname: redis
    ports:
      - '6379:6379'

  celery-worker:
    image: cosobenin/grm-app:v.1.0.8
    restart: on-failure
    command: celery-worker
    env_file: .env
    depends_on:
      - django-app
      - db
      - redis
    volumes:
      - static-content:/usr/appserver/staticfiles

  celery-beat:
    image: cosobenin/grm-app:v.1.0.8
    restart: on-failure
    command: celery-beat
    env_file: .env
    depends_on:
      - django-app
      - db
      - redis
    volumes:
      - static-content:/usr/appserver/staticfiles

volumes:
  static-content:
  pg_data:

