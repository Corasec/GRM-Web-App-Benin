{% load i18n %}

<div class="card-header">
	<h3 class="card-title">
		{{ card_title }}
	</h3>
</div>
<div class="card-body">
	<div class="text-right">
		<button id="export-summary-btn" class="btn btn-info">
			{% translate "Export as PDF" %}
		</button>
	</div>
	<div id="summary-area">
		{% include 'wizard/_summary_sections.html' %}
	</div>
</div>
<div class="card-footer">
	<button id="previous_step" data-step="{{ step }}" class="btn btn-secondary disabled-on-submit">
		<i class="fa fa-chevron-left mr-2"></i>
		{% translate "Previous" %}
	</button>
	<button id="final_step"
			class="btn btn-primary float-right disabled-on-submit {% if disabled_submit %}disabled{% endif %}">
		{% translate "Save and Finish" %}
	</button>
</div>
