# GRM / eMGP production stack — see DEPLOY.md at the repository root.
#
#   cp .env.example .env    # then fill it
#   docker compose pull && docker compose up -d
#
# HTTPS is terminated before this server (domain provider): nginx listens on HTTP only.
name: grm

x-app: &app
  image: ${GRM_IMAGE:-cosobenin/grm-app:latest}
  restart: always
  env_file: .env
  volumes:
    # Attachments and photos: must survive image updates
    - media:/usr/appserver/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

# Start order: db (healthy) + redis -> django-app (migrations + collectstatic, then gunicorn: healthy)
#              -> celery-worker, celery-beat, nginx. Celery needs the migrated database (beat reads its
#              schedules from a migrated table), nginx needs gunicorn and the collected static files.
x-after-migrations: &after-migrations
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    django-app:
      condition: service_healthy

services:
  django-app:
    <<: *app
    # At each start: migrate + collectstatic, then gunicorn on :9000 (see src/run.sh "serve")
    command: ["serve"]
    volumes:
      - media:/usr/appserver/media
      - static:/usr/appserver/staticfiles
    expose:
      - "9000"
    healthcheck:
      # gunicorn only listens once migrations and collectstatic are done
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9000), 3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Automatic assignment, escalation, appeals, metrics (scheduled by celery-beat)
  celery-worker:
    <<: [*after-migrations, *app]  # first wins: keep the "after migrations" dependencies
    command: ["celery-worker"]

  celery-beat:
    <<: [*after-migrations, *app]  # first wins: keep the "after migrations" dependencies
    command: ["celery-beat"]

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # not published: only reachable from the other containers

  redis:
    image: redis:7-alpine
    restart: always

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    depends_on:
      django-app:
        condition: service_healthy

volumes:
  pg_data:
  static:
  media:
