[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grm-learning-materials"
version = "0.1.0"
description = "Reusable Django app for managing bilingual learning materials (articles, videos, PDFs) with role-based targeting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"grm_learning_materials" = [
    "templates/**/*.html",
    "static/**/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests_settings"
pythonpath = ["src"]
