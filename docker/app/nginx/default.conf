# GRM / eMGP — nginx in front of gunicorn (see DEPLOY.md).
# HTTPS is terminated by the domain provider in front of this server: keep its X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream django_app {
    server django-app:9000;
}

server {
    listen 80;
    server_name mgp.coso.gouv.bj;
    server_tokens off;

    # Attachments are limited to 5 MB by the app; Excel imports stay well below this
    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Issue attachments and photos (random file names, no directory listing)
    location /media/ {
        alias /var/www/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        # Excel imports and reports can take a while
        proxy_read_timeout 300s;
    }
}
