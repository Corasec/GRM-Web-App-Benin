{% load static i18n %}

<!-- Navbar -->
<nav class="main-header wizard-header navbar navbar-expand navbar-white navbar-light">
    <!-- Left navbar links -->
    <ul class="navbar-nav">
        <li class="nav-item d-none d-sm-inline-block">
            <div class="nav-greetings">
                {% translate 'Welcome' %}, {{ user.first_name }}!
            </div>
        </li>
    </ul>

    <!-- Right navbar links -->
    <ul class="navbar-nav ml-auto">
        {% if OTHER_LANGUAGES %}
            {% include 'layouts/language_dropdown.html' %}
        {% endif %}
        <li class="nav-item">
            {# Django >= 5.0: logout only accepts POST #}
            <form method="post" action="{% url 'dashboard:authentication:logout' %}" class="form-inline m-0">
                {% csrf_token %}
                <button type="submit" class="nav-link btn btn-link border-0" title="{% translate 'Logout' %}">
                    <i class="fa fa-sign-out"></i>
                </button>
            </form>
        </li>
    </ul>
</nav>
<!-- /.navbar -->
